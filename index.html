<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <link rel="manifest" href="manifest.json">
    <title>动态流式二维码 v2.2 — 接收端</title>
    <style>
        :root {
            --color-primary: #1a73e8;
            --color-primary-hover: #1557b0;
            --color-text: #333333;
            --color-text-secondary: #666666;
            --color-bg: #f5f5f5;
            --color-card-bg: #ffffff;
            --color-border: #e0e0e0;
            --color-success: #4caf50;
            --color-warning: #e94560;
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.1);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            --font-mono: "SF Mono", "Cascadia Code", "Consolas", "Liberation Mono", monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); color: var(--color-text); background: var(--color-bg); padding: 16px; max-width: 600px; margin: 0 auto; line-height: 1.6; }
        h1 { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 16px; }
        .section { background: var(--color-card-bg); border-radius: 8px; box-shadow: var(--shadow-card); padding: 16px; margin-bottom: 16px; }
        .camera-wrap { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
        .camera-wrap video { width: 100%; display: block; border-radius: 8px; }
        .scan-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 65%; aspect-ratio: 1; border: 2px dashed rgba(255,255,255,0.6); border-radius: 12px; pointer-events: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .scan-overlay.flash { border-color: var(--color-success); box-shadow: 0 0 20px rgba(76,175,80,0.5); }
        .status-bar { text-align: center; margin-top: 12px; }
        .status-text { font-size: 14px; font-weight: 500; color: var(--color-text-secondary); }
        .progress-wrap { margin-top: 12px; }
        .progress-bar-outer { background: #e8e8e8; border-radius: 4px; overflow: hidden; height: 8px; }
        .progress-bar-inner { height: 100%; background: var(--color-primary); border-radius: 4px; width: 0%; transition: width 0.2s; }
        .progress-text { text-align: center; font-size: 13px; color: var(--color-text-secondary); margin-top: 6px; font-family: var(--font-mono); }
        .chunk-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .chunk-tag { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 28px; border-radius: 4px; font-size: 12px; font-weight: 600; font-family: var(--font-mono); border: 1px solid var(--color-border); background: #f9f9f9; color: var(--color-text-secondary); transition: all 0.2s; }
        .chunk-tag.collected { background: var(--color-success); color: #fff; border-color: var(--color-success); }
        .chunk-tag.parity { background: #ff9800; color: #fff; border-color: #ff9800; }
        .controls { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
        .btn { padding: 8px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background: var(--color-primary); color: #fff; }
        .btn-primary:hover { background: var(--color-primary-hover); }
        .btn-secondary { background: #eee; color: var(--color-text); }
        .btn-secondary:hover { background: #ddd; }
        .result-section { display: none; }
        .result-section.active { display: block; }
        .result-stats { display: flex; gap: 24px; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 12px; }
        .result-stats .value { font-weight: 600; color: var(--color-text); font-family: var(--font-mono); }
        .result-text { width: 100%; min-height: 120px; max-height: 300px; padding: 12px; border: 1px solid var(--color-border); border-radius: 6px; font-family: var(--font-sans); font-size: 13px; line-height: 1.6; resize: vertical; outline: none; background: #fafafa; }
        .result-actions { margin-top: 12px; display: flex; gap: 12px; }
        .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #333; color: #fff; padding: 10px 24px; border-radius: 6px; font-size: 14px; z-index: 9999; transition: transform 0.3s; pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .debug-panel { background: #1a1a2e; color: #a0ffa0; font-family: var(--font-mono); font-size: 11px; padding: 10px; border-radius: 6px; margin-top: 12px; max-height: 200px; overflow-y: auto; line-height: 1.5; display: none; }
        .debug-panel.active { display: block; }
        .debug-panel .err { color: #ff6b6b; }
        .debug-panel .ok { color: #4caf50; }
        .debug-panel .warn { color: #ff9800; }
        @media (max-width: 480px) { body { padding: 12px; } h1 { font-size: 18px; } }
    </style>
</head>
<body>
    <h1>&#x1F4F1; 动态流式二维码 v2.2 — 接收端</h1>
    <div class="section">
        <div class="camera-wrap">
            <video id="video" playsinline autoplay muted></video>
            <div class="scan-overlay" id="scanOverlay"></div>
        </div>
        <div class="status-bar">
            <div class="status-text" id="statusText">正在初始化...</div>
        </div>
        <div class="progress-wrap">
            <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">0</div>
        </div>
        <div class="chunk-grid" id="chunkGrid"></div>
    </div>
    <div class="section result-section" id="resultSection">
        <div class="result-stats">
            <span>字数：<span class="value" id="charResult">0</span></span>
            <span>字节：<span class="value" id="byteResult">0</span></span>
        </div>
        <textarea class="result-text" id="resultText" readonly></textarea>
        <div class="result-actions">
            <button class="btn btn-primary" id="btnCopy">复制全文</button>
            <button class="btn btn-secondary" id="btnReset">重新扫描</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="section">
        <div class="controls">
            <button class="btn btn-secondary" id="btnDebug" onclick="document.getElementById('debugPanel').classList.toggle('active')">调试日志</button>
        </div>
        <div class="debug-panel" id="debugPanel"></div>
    </div>

    <script src="jsQR.js"></script>
    <script src="pako.min.js"></script>
    <script src="reed-solomon.js"></script>
    <script>
    (function() {
        'use strict';
        var sharedEncoder = new TextEncoder();

        // ---- Header Parser (v2 text + v3 binary) ----
        function parseHeader(payload) {
            // v3 binary: starts with "v3" (0x76 0x33), 13 bytes total
            if (payload.length >= 13 && payload.charCodeAt(0) === 0x76 && payload.charCodeAt(1) === 0x33) {
                var flags = payload.charCodeAt(2);
                var pn = payload.charCodeAt(3) | (payload.charCodeAt(4) << 8);
                var tp = payload.charCodeAt(5) | (payload.charCodeAt(6) << 8);
                var tc = payload.charCodeAt(7) | (payload.charCodeAt(8) << 8)
                       | (payload.charCodeAt(9) << 16) | (payload.charCodeAt(10) << 24);
                var fk = payload.charCodeAt(12);
                var type = (flags >> 6) & 0x03;  // 01=data, 10=parity
                return {
                    partNum: pn,
                    totalParts: tp,
                    totalChars: tc,
                    chunkBytes: payload.length - 13,
                    compressed: (flags & 0x01) === 1,
                    parityCount: (flags >> 1) & 0x1F,
                    dataFrames: fk,
                    isData: type === 1,
                    body: payload.substring(13)
                };
            }
            // v2 text fallback
            var match = payload.match(/^v2\[(\d+)\/(\d+)\]t:(\d+)\|c:(\d+)\|z:(\d+)\|r:(\d+)\|f:(\d+)\n/);
            if (!match) return null;
            return {
                partNum: parseInt(match[1], 10),
                totalParts: parseInt(match[2], 10),
                totalChars: parseInt(match[3], 10),
                chunkBytes: parseInt(match[4], 10),
                compressed: parseInt(match[5], 10) === 1,
                parityCount: parseInt(match[6], 10),
                dataFrames: parseInt(match[7], 10),
                isData: true,
                body: payload.substring(match[0].length)
            };
        }

        // ---- State ----
        var video = null;
        var scanCanvas = null;
        var scanCtx = null;
        var processCanvas = null;
        var processCtx = null;
        var PROCESS_WIDTH = 1280;
        var collected = {};
        var collectedCount = 0;
        var totalParts = null;
        var expectedTotalChars = null;
        var isCompressed = false;
        var parityCount = 0;
        var dataFrames = null;
        var isScanning = false;
        var scanCount = 0;
        var detectCount = 0;
        var parseOkCount = 0;
        var parseFailCount = 0;
        var lastDebugTime = 0;

        // ---- UI Helpers ----
        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(function() { t.classList.remove('show'); }, 2500);
        }

        function setStatus(text) {
            document.getElementById('statusText').textContent = text;
        }

        function updateProgress() {
            var pct = totalParts ? Math.round((collectedCount / totalParts) * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            var progressInfo = collectedCount + (totalParts ? ' / ' + totalParts : '');
            if (dataFrames && parityCount > 0) {
                var have = 0;
                for (var i = 1; i <= dataFrames; i++) { if (collected[i]) have++; }
                progressInfo += '  (数据:' + have + '/' + dataFrames + ')';
            }
            document.getElementById('progressText').textContent = progressInfo;
            updateChunkGrid();
        }

        function updateChunkGrid() {
            var grid = document.getElementById('chunkGrid');
            grid.innerHTML = '';
            var count = totalParts || collectedCount;
            for (var i = 1; i <= count; i++) {
                var span = document.createElement('span');
                var cls = 'chunk-tag';
                if (collected[i]) cls += ' collected';
                else if (dataFrames && i > dataFrames) cls += ' parity';
                span.className = cls;
                span.textContent = i;
                grid.appendChild(span);
            }
        }

        function onNewFrameScanned(partNum) {
            var overlay = document.getElementById('scanOverlay');
            overlay.classList.add('flash');
            setTimeout(function() { overlay.classList.remove('flash'); }, 200);
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // ---- Convert QR body string to Uint8Array ----
        function bodyToBytes(body) {
            var bytes = new Uint8Array(body.length);
            for (var i = 0; i < body.length; i++) {
                bytes[i] = body.charCodeAt(i) & 0xFF;
            }
            return bytes;
        }

        // ---- Debug Logging ----
        var debugPanel = null;
        function dbg(msg, cls) {
            if (!debugPanel) debugPanel = document.getElementById('debugPanel');
            if (!debugPanel) return;
            var line = document.createElement('div');
            if (cls) line.className = cls;
            line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            debugPanel.appendChild(line);
            debugPanel.scrollTop = debugPanel.scrollHeight;
            // Keep last 100 lines
            while (debugPanel.children.length > 100) debugPanel.removeChild(debugPanel.firstChild);
        }

        // ---- Scanner Init ----
        function initScanner() {
            scanCanvas = document.createElement('canvas');
            scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
            processCanvas = document.createElement('canvas');
            processCtx = processCanvas.getContext('2d', { willReadFrequently: true });

            var vw = video.videoWidth || 640;
            var vh = video.videoHeight || 480;
            scanCanvas.width = vw;
            scanCanvas.height = vh;
            var scale = PROCESS_WIDTH / vw;
            processCanvas.width = PROCESS_WIDTH;
            processCanvas.height = Math.round(vh * scale);

            dbg('摄像头就绪: ' + vw + 'x' + vh + ' → 处理尺寸: ' + processCanvas.width + 'x' + processCanvas.height, 'ok');
            dbg('jsQR 可用: ' + (typeof jsQR === 'function' ? '✓' : '✗'), typeof jsQR === 'function' ? 'ok' : 'err');
        }

        // ---- Core: onFrameDecoded ----
        function onFrameDecoded(parsed) {
            if (parsed.partNum < 1) return;
            if (collected[parsed.partNum]) return;

            collected[parsed.partNum] = bodyToBytes(parsed.body);
            collectedCount++;

            if (!totalParts || parsed.totalParts > totalParts) totalParts = parsed.totalParts;
            if (parsed.totalChars > 0) expectedTotalChars = parsed.totalChars;
            if (parsed.compressed) isCompressed = true;
            if (parsed.parityCount > 0) parityCount = parsed.parityCount;
            if (parsed.dataFrames > 0) dataFrames = parsed.dataFrames;

            onNewFrameScanned(parsed.partNum);
            updateProgress();

            // ★ D2: 数据帧优先 — 收到所有数据帧即可组装（无需等校验帧）
            if (dataFrames && parityCount > 0) {
                var haveData = 0;
                for (var i = 1; i <= dataFrames; i++) { if (collected[i]) haveData++; }
                if (haveData >= dataFrames) {
                    assembleAndShow();
                    return;
                }
            }
            // Fallback: 收到所有帧时组装
            if (totalParts && collectedCount >= totalParts) {
                assembleAndShow();
            }
        }

        // ---- 将 jsQR 的 binaryData (字节数组) 还原为 Latin-1 字符串 ----
        function binaryDataToString(bytes) {
            var s = '';
            for (var i = 0; i < bytes.length; i++) {
                s += String.fromCharCode(bytes[i]);
            }
            return s;
        }

        // ---- Scan Loop ----
        function scanFrame() {
            if (!isScanning) return;
            if (video.readyState >= video.HAVE_ENOUGH_DATA) {
                scanCount++;
                scanCtx.drawImage(video, 0, 0);
                processCtx.drawImage(scanCanvas, 0, 0, processCanvas.width, processCanvas.height);
                var imageData = processCtx.getImageData(0, 0, processCanvas.width, processCanvas.height);
                try {
                    var result = jsQR(imageData.data, imageData.width, processCanvas.height, {
                        inversionAttempts: 'attemptBoth'
                    });
                    if (result) {
                        detectCount++;
                        // ★ 关键修复: 用 binaryData (原始字节) 而非 data (UTF-8解码后的文本)
                        // jsQR 的 decodeByte 对二进制数据做 decodeURIComponent 会丢失字节≥128
                        var rawText = '';
                        if (result.binaryData && result.binaryData.length > 0) {
                            rawText = binaryDataToString(result.binaryData);
                        } else if (result.data) {
                            rawText = result.data;
                        }
                        if (rawText) {
                            var parsed = parseHeader(rawText);
                            if (parsed && parsed.partNum >= 1) {
                                parseOkCount++;
                                dbg('✓ 帧#' + parsed.partNum + '/' + parsed.totalParts + ' 已接收 (累计' + collectedCount + '帧)', 'ok');
                                onFrameDecoded(parsed);
                            } else {
                                parseFailCount++;
                                if (parseFailCount <= 5 || parseFailCount % 50 === 0) {
                                    var preview = rawText.substring(0, 40);
                                    var hexPreview = '';
                                    for (var hi = 0; hi < Math.min(20, rawText.length); hi++) {
                                        hexPreview += ('0' + rawText.charCodeAt(hi).toString(16)).slice(-2) + ' ';
                                    }
                                    dbg('✗ QR已检测但header解析失败 (' + parseFailCount + '次): hex=' + hexPreview + ' text="' + preview.replace(/\n/g,'\\n') + '"', 'warn');
                                }
                            }
                        }
                    }
                } catch (e) {
                    dbg('jsQR 异常: ' + e.message, 'err');
                }

                // 定期输出调试统计
                var now = Date.now();
                if (now - lastDebugTime > 3000) {
                    lastDebugTime = now;
                    if (scanCount > 0) {
                        dbg('扫描统计: 处理' + scanCount + '帧 | QR检测' + detectCount + '次 | 解析成功' + parseOkCount + '次 | 解析失败' + parseFailCount + '次');
                    }
                    scanCount = 0; detectCount = 0; parseOkCount = 0; parseFailCount = 0;
                }
            } else {
                if (!scanFrame._waitLogged) {
                    dbg('等待视频数据... readyState=' + video.readyState, 'warn');
                    scanFrame._waitLogged = true;
                }
            }
            requestAnimationFrame(scanFrame);
        }

        // ---- Assembly with RS decode + pako ungzip ----
        function assembleAndShow() {
            var k = dataFrames || totalParts;
            var r = parityCount || 0;
            var n = totalParts || k;

            var allPresent = true;
            for (var i = 1; i <= n; i++) {
                if (!collected[i]) { allPresent = false; break; }
            }

            if (!allPresent && r > 0 && k > 0) {
                setStatus('RS纠错恢复中...');
                var shards = new Array(n);
                var avail = [];
                for (var i = 0; i < n; i++) {
                    if (collected[i + 1]) {
                        shards[i] = collected[i + 1];
                        avail.push(i);
                    }
                }
                if (avail.length < k) {
                    setStatus('已收到 ' + collectedCount + '/' + n + ' 帧，还需 ' + (k - avail.length) + ' 帧数据');
                    return;
                }
                try {
                    var recovered = RS.decode(shards, avail, k);
                    for (var i = 0; i < n; i++) {
                        if (recovered[i]) collected[i + 1] = recovered[i];
                    }
                    var ok = true;
                    for (var i = 1; i <= k; i++) {
                        if (!collected[i]) { ok = false; break; }
                    }
                    if (!ok) {
                        setStatus('RS纠错失败，继续扫描...');
                        return;
                    }
                } catch (e) {
                    setStatus('RS纠错出错: ' + e.message);
                    return;
                }
            } else if (!allPresent) {
                var missing = [];
                for (var i = 1; i <= n; i++) { if (!collected[i]) missing.push(i); }
                setStatus('缺失第 ' + missing.join(',') + ' 帧，继续扫描...');
                return;
            }

            // Stop camera
            isScanning = false;
            var stream = video.srcObject;
            if (stream) {
                stream.getTracks().forEach(function(t) { t.stop(); });
                video.srcObject = null;
            }

            // Concatenate data frames (first k frames)
            var chunks = [];
            var totalByteLen = 0;
            for (var i = 1; i <= k; i++) {
                chunks.push(collected[i]);
                totalByteLen += collected[i].length;
            }
            // Debug: show chunk details
            dbg('组装: k=' + k + ' 数据帧长度: ' + chunks.map(function(c){return c.length;}).join(','));
            // Show first chunk's first 20 bytes as hex
            if (chunks[0]) {
                var hex0 = '';
                for (var di = 0; di < Math.min(20, chunks[0].length); di++) hex0 += ('0' + chunks[0][di].toString(16)).slice(-2) + ' ';
                dbg('帧#1前20字节: ' + hex0);
            }
            var combined = new Uint8Array(totalByteLen);
            var offset = 0;
            for (var i = 0; i < chunks.length; i++) {
                combined.set(chunks[i], offset);
                offset += chunks[i].length;
            }

            // Decompress with SHA-256 integrity verification
            setStatus('SHA-256 校验中...');
            dbg('combined: ' + combined.length + '字节');
            // Show combined's first 40 bytes (should be SHA-256 hash + start of gzip)
            var combHex = '';
            for (var ci = 0; ci < Math.min(40, combined.length); ci++) combHex += ('0' + combined[ci].toString(16)).slice(-2) + ' ';
            dbg('combined前40字节: ' + combHex);

            var decompressAndShow = function(finalText) {
                // Show result
                var statusEl = document.getElementById('statusText');
                if (expectedTotalChars && finalText.length !== expectedTotalChars) {
                    statusEl.textContent = '⚠️ 字数不匹配：预期 ' + expectedTotalChars + '，实际 ' + finalText.length;
                    statusEl.style.color = 'var(--color-warning)';
                } else {
                    var msg = '✅ 扫描完成！共 ' + collectedCount + ' 帧';
                    if (r > 0) msg += ' (RS纠错:' + r + ')';
                    statusEl.textContent = msg;
                    statusEl.style.color = 'var(--color-success)';
                }

                document.getElementById('resultText').value = finalText;
                document.getElementById('charResult').textContent = finalText.length.toLocaleString();
                document.getElementById('byteResult').textContent = sharedEncoder.encode(finalText).length.toLocaleString();
                document.getElementById('resultSection').classList.add('active');

                if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]);
            };

            if (isCompressed) {
                // Extract SHA-256 hash (first 32 bytes) and compressed data (rest)
                if (combined.length < 33) {
                    setStatus('⚠️ 数据过短，无法提取 SHA-256 校验');
                    return;
                }
                var expectedHash = combined.slice(0, 32);
                var compressedData = combined.slice(32);

                crypto.subtle.digest('SHA-256', compressedData).then(function(hashBuffer) {
                    var actualHash = new Uint8Array(hashBuffer);
                    // Debug: show hash comparison
                    var expHex = '', actHex = '', firstDiff = -1;
                    for (var hi = 0; hi < 32; hi++) {
                        expHex += ('0' + expectedHash[hi].toString(16)).slice(-2);
                        actHex += ('0' + actualHash[hi].toString(16)).slice(-2);
                        if (expectedHash[hi] !== actualHash[hi] && firstDiff < 0) firstDiff = hi;
                    }
                    dbg('期望hash: ' + expHex.substring(0, 16) + '...');
                    dbg('实际hash: ' + actHex.substring(0, 16) + '...');
                    if (firstDiff >= 0) {
                        dbg('首个差异: byte[' + firstDiff + '] 期望=' + expectedHash[firstDiff].toString(16) + ' 实际=' + actualHash[firstDiff].toString(16), 'err');
                    }
                    // Compare hashes
                    var match = true;
                    for (var hi = 0; hi < 32; hi++) {
                        if (expectedHash[hi] !== actualHash[hi]) { match = false; break; }
                    }
                    if (!match) {
                        setStatus('⚠️ SHA-256 校验失败！数据可能已损坏');
                        return;
                    }
                    try {
                        var decompressed = pako.ungzip(compressedData);
                        var finalText = new TextDecoder('utf-8').decode(decompressed);
                        decompressAndShow(finalText);
                    } catch (e) {
                        setStatus('⚠️ 解压/解码失败: ' + e.message);
                    }
                }).catch(function(e) {
                    setStatus('⚠️ SHA-256 校验出错: ' + e.message);
                });
            } else {
                try {
                    var finalText = new TextDecoder('utf-8').decode(combined);
                    decompressAndShow(finalText);
                } catch (e) {
                    setStatus('⚠️ 解码失败: ' + e.message);
                }
            }
        }

        // ---- Copy ----
        function copyText() {
            var text = document.getElementById('resultText').value;
            if (!text) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() { showToast('已复制到剪贴板'); });
            } else {
                var ta = document.getElementById('resultText');
                ta.select();
                document.execCommand('copy');
                showToast('已复制到剪贴板');
            }
        }

        // ---- Camera ----
        function startCamera() {
            video = document.getElementById('video');
            setStatus('正在请求摄像头权限...');
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            }).then(function(stream) {
                video.srcObject = stream;
                video.setAttribute('playsinline', 'true');
                video.play().then(function() {
                    initScanner();
                    isScanning = true;
                    setStatus('扫描中... 请将摄像头对准电脑屏幕');
                    requestAnimationFrame(scanFrame);
                });
            }).catch(function(err) {
                if (err.name === 'NotAllowedError') {
                    setStatus('❌ 摄像头权限被拒绝，请允许后刷新');
                } else if (err.name === 'NotFoundError') {
                    setStatus('❌ 未找到摄像头');
                } else {
                    setStatus('❌ 摄像头错误：' + err.message);
                }
            });
        }

        // ---- Reset ----
        function resetScanner() {
            isScanning = false;
            if (video && video.srcObject) {
                video.srcObject.getTracks().forEach(function(t) { t.stop(); });
                video.srcObject = null;
            }
            collected = {};
            collectedCount = 0;
            totalParts = null;
            expectedTotalChars = null;
            isCompressed = false;
            parityCount = 0;
            dataFrames = null;
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressText').textContent = '0';
            document.getElementById('chunkGrid').innerHTML = '';
            document.getElementById('resultSection').classList.remove('active');
            document.getElementById('resultText').value = '';
            document.getElementById('statusText').style.color = '';
            startCamera();
        }

        // ---- Init ----
        document.addEventListener('DOMContentLoaded', function() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus('❌ 当前浏览器不支持摄像头');
                return;
            }
            document.getElementById('btnCopy').addEventListener('click', copyText);
            document.getElementById('btnReset').addEventListener('click', resetScanner);
            startCamera();

            // Register Service Worker for PWA offline support
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(function() {});
            }
        });
    })();
    </script>
</body>
</html>
