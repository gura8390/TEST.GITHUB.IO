<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f3460" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="style.css" />
    <title>动态流式二维码 2.7.1 · 接收</title>
  </head>
  <body>
    <header class="page-header">
      <div>
        <p class="eyebrow">屏幕 → 摄像头 · 离线传输</p>
        <h1>接收内容 <small>2.7.1</small></h1>
      </div>
      <a href="../send/index.html">发送页 →</a>
    </header>
    <main>
      <section aria-label="扫描二维码">
        <div class="camera-wrap">
          <video
            id="video"
            playsinline
            autoplay
            muted
            aria-label="摄像头预览"
          ></video>
          <div class="scan-overlay" id="scanOverlay"></div>
          <span class="camera-label">保持二维码及四周白边完整可见</span>
        </div>
        <p id="cameraInfo" class="hint"></p>
        <div class="controls">
          <button class="btn btn-primary" id="btnCamera">开始扫描</button
          ><button class="btn btn-secondary" id="btnRetry">重新扫描</button
          ><button class="btn btn-secondary" id="btnSwitchCam" disabled>
            切换镜头</button
          ><button class="btn btn-secondary" id="btnTorch" hidden>手电筒</button
          ><button class="btn btn-secondary" id="btnSound" aria-pressed="false">
            提示音：关
          </button>
        </div>
        <p id="statusText" class="status-text" role="status">点击开始扫描</p>
        <div
          class="progress-track"
          id="progressBar"
          role="progressbar"
          aria-label="数据帧接收进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="progressFill"></div>
        </div>
        <p id="progressText" class="progress-text">0 / 0</p>
        <p id="missingText" class="hint"></p>
        <p id="badFrames" class="hint"></p>
        <div class="chunk-grid" id="chunkGrid" aria-label="帧接收状态"></div>
      </section>
      <section
        class="result-section"
        id="resultSection"
        hidden
        aria-labelledby="textTitle"
      >
        <h2 id="textTitle">文本已校验</h2>
        <p class="result-stats">
          <span id="charResult">0</span> 字符 · <span id="byteResult">0 B</span>
        </p>
        <label for="resultText" class="hint">接收原文</label
        ><textarea class="result-text" id="resultText" readonly></textarea>
        <div class="controls">
          <button class="btn btn-primary" id="btnCopy">复制全文</button
          ><button class="btn btn-secondary" id="btnSaveText">保存文本</button
          ><button class="btn btn-secondary" id="btnReset">接收下一份</button>
        </div>
      </section>
      <section
        class="result-section"
        id="fileResultSection"
        hidden
        aria-labelledby="fileTitle"
      >
        <h2 id="fileTitle">文件已校验</h2>
        <p class="file-name" id="fileName"></p>
        <p class="hint" id="fileSize"></p>
        <div class="controls">
          <button class="btn btn-primary" id="btnDownload">下载文件</button
          ><button class="btn btn-secondary" id="btnReset2">接收下一份</button>
        </div>
      </section>
      <aside class="guide">
        <h3>接收提示</h3>
        <p>
          第一次使用需通过 HTTPS
          加载完整接收页；缓存成功后可离线打开。普通局域网 HTTP
          地址无法使用摄像头。
        </p>
        <p>
          进度停住时保持对准，或把缺帧号输入电脑的“只播缺帧”。暂停和切换镜头会保留进度；重新扫描会清空当前传输。
        </p>
        <p id="offlineStatus" class="hint">
          通过 HTTPS 或本机 localhost 可启用离线缓存
        </p>
      </aside>
    </main>
    <footer>动态流式二维码 2.7.1 · 不上传视频与接收内容</footer>
    <div class="toast" id="toast" role="status"></div>
    <script src="jsQR.js"></script>
    <script src="pako.min.js"></script>
    <script src="../shared/protocol.js"></script>
    <script src="../shared/capacity.js"></script>
    <script src="../shared/transfer.js"></script>
    <script src="app.js"></script>
  </body>
</html>
